<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación: Primeros Auxilios Básicos</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
    .card { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
    button:hover { background: #219150; }
    .timer { background: #ffeaa7; color: #d63031; padding: 10px; font-weight: bold; text-align: center; border-radius: 5px; margin-bottom: 15px; }
    .pregunta-block { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    .img-pregunta { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin: 10px 0; }
    .error-msg { background: #ff7675; color: white; padding: 12px; border-radius: 5px; text-align: center; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    th { background-color: #f2f2f2; }
    .btn-admin { background: #2980b9; margin-top: 5px; padding: 6px 10px; width: auto; }
  </style>
</head>
<body>

<div class="card">
  <!-- PANTALLA REGISTRO -->
  <div id="pantalla-ingreso">
    <h2>Evaluación de Primeros Auxilios</h2>
    <div id="error-ingreso" class="error-msg" style="display:none;"></div>
    <div class="form-group">
      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
    </div>
    <div class="form-group">
      <label for="documento">Documento de Identidad / Cédula:</label>
      <input type="text" id="documento" placeholder="Ej. 10203040">
    </div>
    <button onclick="iniciarExamen()">Comenzar Evaluación</button>
    <button onclick="cargarAdmin()" style="background:#7f8c8d; margin-top:15px;">Panel Administrador</button>
  </div>

  <!-- PANTALLA EXAMEN -->
  <div id="pantalla-examen" style="display:none;">
    <div class="timer" id="timer">Tiempo restante: 05:00</div>
    <p><strong>Participante:</strong> <span id="lbl-nombre"></span></p>
    <p><strong>Número de intento:</strong> <span id="lbl-intento"></span> de 2</p>
    <form id="quiz-form"></form>
    <button onclick="enviarRespuestas()">Finalizar y Enviar</button>
  </div>

  <!-- PANTALLA RESULTADOS -->
  <div id="pantalla-resultados" style="display:none; text-align:center;">
    <h2>Resultado de la Evaluación</h2>
    <h3 id="lbl-puntaje"></h3>
    <p id="lbl-mensaje-estado"></p>
  </div>

  <!-- PANEL ADMINISTRADOR -->
  <div id="pantalla-admin" style="display:none;">
    <h2>Panel de Administración</h2>
    <button onclick="volverInicio()" style="background:#7f8c8d; width:auto;">← Volver</button>
    <table>
      <thead>
        <tr>
          <th>Documento</th>
          <th>Nombre</th>
          <th>Intentos</th>
          <th>Puntaje</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-admin"></tbody>
    </table>
  </div>
</div>

<script>
  let usuarioActual = {};
  let preguntasCargadas = [];
  let tiempoRestante = 300; // 5 minutos
  let timerInterval;

  async function iniciarExamen() {
    const nombre = document.getElementById('nombre').value.trim();
    const documento = document.getElementById('documento').value.trim();
    const errorDiv = document.getElementById('error-ingreso');

    if (!nombre || !documento) {
      errorDiv.innerText = 'Por favor complete todos los campos.';
      errorDiv.style.display = 'block';
      return;
    }

    const res = await fetch('/api/iniciar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, documento })
    });

    const data = await res.json();

    if (!res.ok) {
      errorDiv.innerText = data.error;
      errorDiv.style.display = 'block';
      return;
    }

    usuarioActual = { nombre: data.nombre, documento: data.documento };
    preguntasCargadas = data.preguntas;

    document.getElementById('lbl-nombre').innerText = data.nombre;
    document.getElementById('lbl-intento').innerText = data.numeroIntento;
    document.getElementById('pantalla-ingreso').style.display = 'none';
    document.getElementById('pantalla-examen').style.display = 'block';

    renderizarPreguntas();
    iniciarTemporizador();
  }

  function renderizarPreguntas() {
    const form = document.getElementById('quiz-form');
    form.innerHTML = '';

    preguntasCargadas.forEach((p, idx) => {
      const div = document.createElement('div');
      div.className = 'pregunta-block';
      
      let html = `<p><strong>${idx + 1}. ${p.texto}</strong></p>`;
      if (p.imagen) {
        html += `<img src="${p.imagen}" class="img-pregunta" alt="Imagen de pregunta">`;
      }

      p.opciones.forEach((op, opIdx) => {
        html += `
          <div>
            <label style="font-weight:normal;">
              <input type="radio" name="p_${p.id}" value="${opIdx}"> ${op}
            </label>
          </div>
        `;
      });

      div.innerHTML = html;
      form.appendChild(div);
    });
  }

  function iniciarTemporizador() {
    timerInterval = setInterval(() => {
      tiempoRestante--;
      let min = Math.floor(tiempoRestante / 60);
      let sec = tiempoRestante % 60;
      document.getElementById('timer').innerText = `Tiempo restante: ${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;

      if (tiempoRestante <= 0) {
        clearInterval(timerInterval);
        alert('El tiempo ha finalizado.');
        enviarRespuestas();
      }
    }, 1000);
  }

  async function enviarRespuestas() {
    clearInterval(timerInterval);

    const respuestas = preguntasCargadas.map(p => {
      const selected = document.querySelector(`input[name="p_${p.id}"]:checked`);
      return {
        preguntaId: p.id,
        seleccion: selected ? parseInt(selected.value) : -1
      };
    });

    const res = await fetch('/api/evaluar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        documento: usuarioActual.documento,
        respuestas
      })
    });

    const data = await res.json();

    document.getElementById('pantalla-examen').style.display = 'none';
    document.getElementById('pantalla-resultados').style.display = 'block';
    document.getElementById('lbl-puntaje').innerText = `Puntaje: ${data.puntaje} / ${data.total} (${data.porcentaje}%)`;

    if (data.bloqueado) {
      document.getElementById('lbl-mensaje-estado').innerText = 'Has alcanzado el límite máximo de 2 intentos permitidos.';
    } else {
      document.getElementById('lbl-mensaje-estado').innerText = 'Aún tienes 1 intento disponible si deseas mejorar tu nota.';
    }
  }

  async function cargarAdmin() {
    const res = await fetch('/api/admin/resultados');
    const data = await res.json();

    const tbody = document.getElementById('tabla-admin');
    tbody.innerHTML = '';

    data.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.documento}</td>
        <td>${row.nombre}</td>
        <td>${row.intentos_realizados} / 2</td>
        <td>${row.puntaje !== null ? row.puntaje + '/' + row.total_preguntas : 'N/A'}</td>
        <td>${row.bloqueado ? 'Bloqueado' : 'Habilitado'}</td>
        <td>
          <button class="btn-admin" onclick="desbloquear('${row.documento}')">Habilitar Intento</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('pantalla-ingreso').style.display = 'none';
    document.getElementById('pantalla-admin').style.display = 'block';
  }

  async function desbloquear(doc) {
    await fetch('/api/admin/desbloquear', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ documento: doc })
    });
    alert(`Permisos restablecidos para la cédula ${doc}`);
    cargarAdmin();
  }

  function volverInicio() {
    document.getElementById('pantalla-admin').style.display = 'none';
    document.getElementById('pantalla-ingreso').style.display = 'block';
  }
</script>
</body>
</html>
